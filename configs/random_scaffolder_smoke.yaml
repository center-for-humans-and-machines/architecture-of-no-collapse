# Offline random-scaffolder smoke: fake LLM, no network or keys.
# The policy draws deepen / innovate / inject independently each turn. Inject is
# disabled (0.0) and the opening topic is off so the run stays offline: either
# would otherwise trigger a Tavily search.
# Set inject > 0 / open_with_topic true to exercise the level-3 path (needs
# TAVILY_API_KEY).
run:
  rounds: 30
  replicates: 1
  seed: 0
  window_size: 10
  memory_turns: 20

agents:
  n: 3
  params:
    temperature: 0.9
    max_tokens: 200
  pool:
    - { provider: fake, model: fake }
    - { provider: fake, model: fake }
    - { provider: fake, model: fake }
  prompt_source: prompts/prompts.yaml

interventions:
  - type: random_scaffolder
    options:
      probabilities:
        deepen: 0.80
        innovate: 0.20
        inject: 0.00
      visibility: all
      # Keep the smoke offline: priming would sample common words and search.
      open_with_topic: false

metrics:
  window_size: 10
  embedding:
    provider: fake
    model: fake
    dim: 64
  enabled: [lexical_diversity, semantic_anchor_sim, semantic_adjacent_sim]

logging:
  out_dir: outputs
  experiment_name: random_scaffolder_smoke
  labels: { experiment: random_scaffolder_smoke }
  console_level: INFO
  file_level: DEBUG
