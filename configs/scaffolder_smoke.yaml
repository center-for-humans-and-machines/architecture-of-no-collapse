# Offline scaffolder smoke: fake LLM + fake embedding, no network or keys.
# Level-3 injection never fires here (the fake model keeps adjacent similarity
# below the threshold) and the opening topic is off, so no Tavily call and no
# word-vector download.
run:
  rounds: 30
  replicates: 1
  seed: 0
  window_size: 10
  memory_turns: 20

agents:
  n: 3
  params:
    temperature: 0.9
    max_tokens: 200
  pool:
    - { provider: fake, model: fake }
    - { provider: fake, model: fake }
    - { provider: fake, model: fake }
  prompt_source: prompts/prompts.yaml

interventions:
  - type: scaffolder
    options:
      threshold: 0.85
      visibility: all
      # Keep the smoke offline: priming would sample GloVe words and search.
      open_with_topic: false
      embedding: { provider: fake, model: fake, dim: 64 }
      seed: 0

metrics:
  window_size: 10
  embedding:
    provider: fake
    model: fake
    dim: 64
  enabled: [lexical_diversity, semantic_anchor_sim, semantic_adjacent_sim]

logging:
  out_dir: outputs
  experiment_name: scaffolder_smoke
  labels: { experiment: scaffolder_smoke }
  console_level: INFO
  file_level: DEBUG
