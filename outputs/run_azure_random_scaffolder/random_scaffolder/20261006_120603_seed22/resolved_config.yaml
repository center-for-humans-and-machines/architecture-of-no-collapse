run:
  rounds: 100
  replicates: 1
  seed: 22
  window_size: 10
  memory_turns: 5
agents:
  n: 1
  params:
    temperature: 0.9
    max_tokens: 500
    top_p: null
    seed: null
    frequency_penalty: null
    presence_penalty: null
  pool:
  - provider: azure
    model: gpt-4o-mini
  prompt_source: prompts/prompts.yaml
  system_prompt: You are an agent in an open-ended multi-agent conversation.
  prompts_override: {}
interventions:
- type: random_scaffolder
  options:
    probabilities:
      deepen: 0.5
      innovate: 0.4
      inject: 0.1
    visibility: injections
    open_with_topic: true
metrics:
  window_size: 10
  embedding:
    provider: vllm
    model: Qwen/Qwen3-Embedding-8B
    dim: null
  enabled:
  - lexical_diversity
  - semantic_anchor_sim
  - semantic_adjacent_sim
  - cross_run_sim
logging:
  out_dir: outputs
  experiment_name: run_azure_random_scaffolder
  labels:
    experiment: run_azure_random_scaffolder
    model: gpt-4o-mini
    condition: random_scaffolder
  console_level: INFO
  file_level: DEBUG
