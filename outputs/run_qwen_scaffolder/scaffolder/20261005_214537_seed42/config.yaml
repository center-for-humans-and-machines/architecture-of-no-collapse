# Real scaffolder run: run_qwen + the three-level scaffolder intervention.
# The adjacent-similarity signal uses the same Qwen3-Embedding-8B endpoint as
# the metrics. Level-3 injection (rare) uses Tavily (from .env) + GloVe word
# vectors (downloaded and cached on first use).
run:
  rounds: 100
  replicates: 1
  seed: 42
  window_size: 10

agents:
  n: 1
  params:
    temperature: 0.9
    max_tokens: 200
  pool:
    - { provider: vllm, model: Qwen/Qwen3-30B-A3B-Instruct-2507 }
  prompt_source: prompts/prompts.yaml

interventions:
  - type: scaffolder
    options:
      threshold: 0.7
      visibility: all
      seed: 67
      embedding: { provider: vllm, model: Qwen/Qwen3-Embedding-8B }

metrics:
  window_size: 10
  embedding:
    provider: vllm
    model: Qwen/Qwen3-Embedding-8B
  enabled: [lexical_diversity, semantic_anchor_sim, semantic_adjacent_sim, cross_run_sim]

logging:
  out_dir: outputs
  experiment_name: run_qwen_scaffolder
  labels:
    experiment: run_qwen_scaffolder
    model: Qwen3-30B-A3B-Instruct-2507
    condition: scaffolder
  console_level: INFO
  file_level: DEBUG
