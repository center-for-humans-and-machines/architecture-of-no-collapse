# Offline random-scaffolder smoke: fake LLM, no network or keys.
# The policy draws deepen / innovate / inject independently each turn. Inject is
# disabled (0.0) so the run stays offline: the fake sampler would otherwise try
# to download GloVe vectors on the first injection. Set inject > 0 to exercise
# the level-3 path (needs TAVILY_API_KEY and the word vectors).
run:
  rounds: 30
  replicates: 1
  seed: 0
  window_size: 10

agents:
  n: 3
  params:
    temperature: 0.9
    max_tokens: 200
  pool:
    - { provider: fake, model: fake }
    - { provider: fake, model: fake }
    - { provider: fake, model: fake }
  prompt_source: prompts/prompts.yaml

interventions:
  - type: random_scaffolder
    options:
      probabilities:
        deepen: 0.80
        innovate: 0.20
        inject: 0.00
      seed: 0
      visibility: all

metrics:
  window_size: 10
  embedding:
    provider: fake
    model: fake
    dim: 64
  enabled: [lexical_diversity, semantic_anchor_sim, semantic_adjacent_sim]

logging:
  out_dir: outputs
  experiment_name: random_scaffolder_smoke
  labels: { experiment: random_scaffolder_smoke }
  console_level: INFO
  file_level: DEBUG
