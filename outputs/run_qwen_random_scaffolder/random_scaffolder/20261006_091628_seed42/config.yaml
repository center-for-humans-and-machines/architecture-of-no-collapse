# Real random-scaffolder run: run_qwen + independent random action sampling.
# Tune the three probabilities to control how often the model is nudged to
# deepen vs. innovate, and how often a brand-new topic is injected. Inject uses
# Tavily (from .env) + GloVe word vectors (downloaded and cached on first use).
run:
  rounds: 100
  replicates: 1
  seed: 42
  window_size: 10

agents:
  n: 1
  params:
    temperature: 0.9
    max_tokens: 200
  pool:
    - { provider: vllm, model: Qwen/Qwen3-30B-A3B-Instruct-2507 }
  prompt_source: prompts/prompts.yaml

interventions:
  - type: random_scaffolder
    options:
      probabilities:
        deepen: 0.80
        innovate: 0.15
        inject: 0.05
      visibility: all

metrics:
  window_size: 10
  embedding:
    provider: vllm
    model: Qwen/Qwen3-Embedding-8B
  enabled: [lexical_diversity, semantic_anchor_sim, semantic_adjacent_sim, cross_run_sim]

logging:
  out_dir: outputs
  experiment_name: run_qwen_random_scaffolder
  labels:
    experiment: run_qwen_random_scaffolder
    model: Qwen3-30B-A3B-Instruct-2507
    condition: random_scaffolder
  console_level: INFO
  file_level: DEBUG
