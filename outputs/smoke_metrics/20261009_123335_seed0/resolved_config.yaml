run:
  rounds: 30
  replicates: 1
  seed: 0
  window_size: 10
  memory_turns: 20
agents:
  n: 3
  params:
    temperature: 0.9
    max_tokens: 200
    top_p: null
    seed: null
    frequency_penalty: null
    presence_penalty: null
  pool:
  - provider: fake
    model: fake
  - provider: fake
    model: fake
  - provider: fake
    model: fake
  prompt_source: prompts/prompts.yaml
  system_prompt: You are an agent in an open-ended multi-agent conversation.
  prompts_override: {}
interventions: []
metrics:
  window_size: 10
  embedding:
    provider: fake
    model: fake
    dim: 64
  enabled:
  - lexical_diversity
  - semantic_anchor_sim
  - semantic_adjacent_sim
  - cross_run_sim
logging:
  out_dir: outputs
  experiment_name: smoke_metrics
  labels:
    experiment: smoke_metrics
  console_level: INFO
  file_level: DEBUG
