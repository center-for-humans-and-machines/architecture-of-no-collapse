# Live smoke: one MPCDF vLLM model, endpoint from .env.
# The model id must match the id the server advertises.
run:
  rounds: 2
  replicates: 1
  seed: 0
  window_size: 10

agents:
  n: 3
  params:
    temperature: 0.9
    max_tokens: 200
  pool:
    - { provider: vllm, model: Qwen/Qwen3-30B-A3B-Instruct-2507 }
    - { provider: vllm, model: Qwen/Qwen3-30B-A3B-Instruct-2507 }
    - { provider: vllm, model: Qwen/Qwen3-30B-A3B-Instruct-2507 }
  prompt_source: prompts/prompts.yaml

interventions: []

metrics:
  window_size: 10
  enabled: []

logging:
  out_dir: outputs
  experiment_name: smoke_vllm
  labels: { experiment: smoke_vllm }
  console_level: INFO
  file_level: DEBUG
