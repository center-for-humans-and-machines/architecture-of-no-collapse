# Actual run: 100 rounds, single Qwen model across the pool, all metrics.
# Endpoint and credentials come from .env; the model id must match the id the
# vLLM server advertises.
run:
  rounds: 100
  replicates: 1
  seed: 42
  window_size: 10

agents:
  n: 1
  params:
    temperature: 0.9
    max_tokens: 200
  pool:
    - { provider: vllm, model: Qwen/Qwen3-30B-A3B-Instruct-2507 }
  prompt_source: prompts/prompts.yaml

interventions: []

metrics:
  window_size: 10
  embedding:
    provider: vllm
    model: Qwen/Qwen3-Embedding-8B
  enabled: [lexical_diversity, semantic_anchor_sim, semantic_adjacent_sim, cross_run_sim]

logging:
  out_dir: outputs
  experiment_name: run_qwen
  labels: { experiment: run_qwen, model: Qwen3-30B-A3B-Instruct-2507 }
  console_level: INFO
  file_level: DEBUG
